<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ thống Luyện thi Giải tích 1</title>

  <!-- KaTeX hiển thị công thức Toán học -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Thanh Taskbar đầu trang gọn gàng: Kỳ thi luyện tập & Phương pháp bấm máy Casio -->
  <header class="portal-topnav">
    <div class="portal-topnav-left">
      <button type="button" class="portal-nav-item" id="sidebar-toggle-btn" title="Ẩn/Hiện Bảng câu hỏi" style="display: none; font-size: 16px;">×</button>
      <button type="button" class="portal-nav-item active" id="nav-home-btn">Kỳ thi luyện tập</button>
      <button type="button" class="portal-nav-item" id="nav-casio-btn">Phương pháp bấm máy Casio</button>
      <span id="active-exam-header-label" style="display: inline-flex; align-items: center; padding: 0 14px; font-size: 13.5px; color: #dbeafe;"></span>
    </div>

    <div class="portal-topnav-right">
      <div class="timer-badge" id="timer-badge" style="display: none;">
        Thời gian: <span>50:00</span>
      </div>
      <button type="button" class="top-action-btn" id="theme-toggle-btn">
        Giao diện tối
      </button>
    </div>
  </header>

  <!-- MÀN HÌNH CHÍNH (SẢNH CHIA THEO TỪNG KHỐI & THỐNG KÊ / LỊCH HỌC) -->
  <div id="lobby-view" class="lobby-wrapper">
    <!-- Render tự động bởi app.js -->
  </div>

  <!-- BỐ CỤC PHÒNG THI & XEM ĐÁP ÁN CHUẨN MOODLE QUIZ -->
  <div class="moodle-layout" id="exam-room-view" style="display: none;">
    <aside class="moodle-sidebar" id="moodle-sidebar">
      <div class="quiz-nav-card">
        <div class="quiz-nav-title">Bảng câu hỏi</div>
        <div class="qn-buttons-grid" id="qn-buttons-grid"></div>
        <div class="quiz-nav-links" id="quiz-nav-links"></div>
      </div>
    </aside>

    <main class="moodle-main" id="moodle-main"></main>
  </div>

  <!-- Modal 6 Phương pháp bấm máy cố định (Mở sẵn toàn bộ) -->
  <div class="modal-overlay" id="casio-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">6 Phương pháp bấm máy CASIO cố định (Áp dụng cho 4 chương)</div>
        <button type="button" class="modal-close" id="close-casio-modal-btn">×</button>
      </div>
      <div id="modal-methods-body"></div>
    </div>
  </div>

  <script src="questions_bank.js"></script>
  <script src="app.js"></script>
</body>
</html>
